; Build configuration: Ulanzi TC001 release, all features (published on GitHub)
; pio run -e tc001 / pio run -e tc001-dev

[tc001_features]
build_flags =
	-D BCP_FEATURE_WIFIMGR=1
	-D BCP_FEATURE_MDNS=1
	-D BCP_FEATURE_BATTERY=1
	-D BCP_FEATURE_CONNECTION_MONITOR=1
	-D BCP_FEATURE_BRIGHTNESS=1
	-D BCP_MODE_BCP=1
	-D BCP_MODE_OFFLINE=1
	-D BCP_MODE_CHESS=1

[env:tc001]
extends = tc001_base
build_flags = ${tc001_features.build_flags}

; Development build: debug output and command console on Serial (see src/devconsole.cpp)
[env:tc001-dev]
extends = tc001_base
build_flags = ${tc001_features.build_flags} -D BCP_DEV
