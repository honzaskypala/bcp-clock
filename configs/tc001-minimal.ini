; Build configuration: Ulanzi TC001 with only the required features (no mDNS, battery and connection
; monitoring, brightness); checks that a build without the optional features compiles
; pio run -e tc001-minimal / pio run -e tc001-minimal-dev

[tc001_minimal_features]
build_flags =
	-D BCP_FEATURE_WIFIMGR=1
	-D BCP_FEATURE_MDNS=0
	-D BCP_FEATURE_BATTERY=0
	-D BCP_FEATURE_CONNECTION_MONITOR=0
	-D BCP_FEATURE_BRIGHTNESS=0
	-D BCP_MODE_BCP=1
	-D BCP_MODE_OFFLINE=0
	-D BCP_MODE_CHESS=0

[env:tc001-minimal]
extends = tc001_base
build_flags = ${tc001_minimal_features.build_flags}

[env:tc001-minimal-dev]
extends = tc001_base
build_flags = ${tc001_minimal_features.build_flags} -D BCP_DEV
