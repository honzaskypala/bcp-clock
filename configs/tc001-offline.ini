; Build configuration: Ulanzi TC001 without network modes: offline countdown and chess clock with battery
; monitoring, no BCP
; mode, no WiFi (no config page, the settings keep their stored values or defaults)
; pio run -e tc001-offline / pio run -e tc001-offline-dev

[tc001_offline_features]
build_flags =
	-D BCP_FEATURE_WIFIMGR=0
	-D BCP_FEATURE_MDNS=0
	-D BCP_FEATURE_BATTERY=1
	-D BCP_FEATURE_CONNECTION_MONITOR=0
	-D BCP_MODE_BCP=0
	-D BCP_MODE_OFFLINE=1
	-D BCP_MODE_CHESS=1

[env:tc001-offline]
extends = tc001_base
build_flags = ${tc001_offline_features.build_flags}

[env:tc001-offline-dev]
extends = tc001_base
build_flags = ${tc001_offline_features.build_flags} -D BCP_DEV
