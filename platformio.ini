; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32 @ 6.12.0
board = nodemcu-32s
framework = arduino
upload_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson@7.4.2
	adafruit/RTClib@2.1.4
	fastled/FastLED@3.10.3
	adafruit/Adafruit GFX Library@1.12.4
	marcmerlin/FastLED NeoMatrix@1.2.0
test_ignore = native/*
test_speed = 115200

; Development build: debug output and command console on Serial (see src/devconsole.cpp)
; pio run -e dev -t upload
[env:dev]
extends = env:nodemcu-32s
build_flags = -DBCP_DEV

; Host unit tests of the hardware independent logic (lib/core, lib/webui)
; pio test -e native
[env:native]
platform = native
test_framework = unity
test_ignore = device/*
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
	bblanchon/ArduinoJson@^7.4.2
lib_ignore = hw, gfx, config, wifimgr, bcp
lib_compat_mode = off
build_flags = -std=gnu++17 -Wno-missing-template-arg-list-after-template-kw -Wno-deprecated-literal-operator -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
